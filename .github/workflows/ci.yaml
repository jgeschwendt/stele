name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Read-only token: the gate never writes, so a compromised step cannot push.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs — a tag or branch can be moved under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: stele's freshness class (§4.5) walks verified.sha..HEAD; a shallow
        # (fetch-depth 1) clone prunes the watermark commit and makes churn uncountable.
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build
      # stele's own graph gate (§5.1 recommended CI order: check → emit --check).
      # NEVER run `stele build` in CI: build is the sole writer of .stele/graph.lock,
      # so running it here would overwrite the committed lock with a fresh one, making
      # check's byte-compare trivially pass and defeating the stale-lock gate.
      - run: ./target/debug/stele check
      - run: ./target/debug/stele emit --check
