name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Read-only token: the gate never writes, so a compromised step cannot push.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs — a tag or branch can be moved under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: stele's freshness class (§4.5) walks verified.sha..HEAD; a shallow
        # (fetch-depth 1) clone prunes the watermark commit and makes churn uncountable.
        with:
          fetch-depth: 0
          persist-credentials: false
      # The pinned toolchain (mise.toml + rust-toolchain.toml's components).
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      # The whole gate, as hk's pre-push runs it: fmt, clippy, tests and stele's own
      # graph gate (§5.1: check → emit --check), in parallel. It never runs `stele build`,
      # the sole writer of .stele/graph.lock, which would make check's byte-compare
      # trivially pass.
      - run: mise run check
