[package]
name = "stele-cli"
version = "0.1.0"
edition = "2024"
description = "stele — typed agent-doc graph reconciled against extracted code truth"
license = "MIT OR Apache-2.0"

[lib]
name = "stele"
path = "src/lib.rs"

[[bin]]
name = "stele"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.26.11"
tree-sitter-elixir = "0.3.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3"
