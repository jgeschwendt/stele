[package]
name = "stele-cli"
version = "0.1.0"
edition = "2024"
description = "stele — typed agent-doc graph reconciled against extracted code truth"
license = "MIT OR Apache-2.0"

[lib]
name = "stele"
path = "src/lib.rs"

[[bin]]
name = "stele"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3"
