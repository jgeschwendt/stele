[package]
name = "stele-cli"
version = "0.2.0"
edition = "2024"
description = "stele — typed agent-doc graph reconciled against extracted code truth"
license-file = "LICENSE.md"

[lib]
name = "stele"
path = "src/lib.rs"

[[bin]]
name = "stele"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tiktoken-rs = "0.12.0"
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.26.11"
tree-sitter-elixir = "0.3.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

# The distribution artifact is one self-contained executable (scripts/release.sh,
# .github/workflows/release.yml). Strip symbols so the shipped binary is lean; every
# release build (local assembly + CI matrix) inherits it.
[profile.release]
strip = true
