[tools]
# hk runs the pre-push gate (hk.pkl); `hk install --mise` wires it.
hk = "2.5.0"
rust = "stable"

# The whole gate: hk's pre-push and CI run this, nothing else. Order is load-bearing —
# the graph gate runs the binary `cargo build` just made. Never `stele build` here: it
# is the sole writer of .stele/graph.lock and would launder a stale lock (§5.1).
[tasks.check]
description = "the gate hk's pre-push and CI run: fmt, clippy, tests, then stele check → emit --check"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
  "cargo build && ./target/debug/stele check && ./target/debug/stele emit --check",
]

[tasks.figures]
description = "Render docs/figures/*.png from the Claude Design canvas source"
run = "docs/figures/export.sh"
